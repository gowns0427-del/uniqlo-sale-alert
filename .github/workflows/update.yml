name: 세일 정보 업데이트

on:
  schedule:
    # 매시 7분 (UTC 기준, 정각은 GitHub Actions 가 붐벼서 피한다)
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 세일 정보 수집
        run: python collector/collect.py --out docs/data.json

      - name: data.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "chore: 세일 정보 업데이트" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
